name: 07-02b Pogoda API CI

on:
  push:
    branches:
      - feature/07-pogoda-api
      - main
  pull_request:
    branches:
      - feature/07-pogoda-api
  workflow_dispatch:

permissions:
  contents: read

env:
  WORKDIR: ./CWICZENIA/07-expressions/pogoda_python_flusk
  TEST_IMAGE: python_pogoda:andrzej-test
  HUB_IMAGE_BASE: piotrskoska/python_pogoda
  DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'prod07' || 'dev07' }}

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          tags: ${{ env.TEST_IMAGE }}
          load: true
          push: false

      - name: Save Docker image
        run: docker save "$TEST_IMAGE" -o image.tar

      - name: Upload Docker artifact
        uses: actions/upload-artifact@v4
        with:
          name: pogoda-image
          path: image.tar
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test Weather API
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip tests]'))
    env:
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
    steps:
      - name: Download Docker artifact
        uses: actions/download-artifact@v4
        with:
          name: pogoda-image

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Validate API key
        if: env.OPENWEATHER_API_KEY == ''
        run: |
          echo "ERROR: Brak sekretu OPENWEATHER_API_KEY"
          exit 1

      - name: Run Docker container
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          docker run -d \
            --name pogoda_api \
            -p 8000:8000 \
            -e OPENWEATHER_API_KEY \
            "$TEST_IMAGE"

      - name: Wait for API
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          echo "Czekam na start API..."
          sleep 10

      - name: Test weather endpoint
        if: env.OPENWEATHER_API_KEY != ''
        run: |
          set -e
          echo "Testowanie endpointu /weather..."
          curl --fail --silent --show-error \
            --get "http://localhost:8000/weather" \
            --data-urlencode "city=Warsaw" \
            --data-urlencode "api_key=$OPENWEATHER_API_KEY"
          echo
          echo "OK - endpoint /weather zwrocil HTTP 2xx"

      - name: Docker logs on failure
        if: failure()
        run: |
          echo "Logi kontenera:"
          docker logs pogoda_api || true

      - name: Cleanup Docker container
        if: always()
        run: |
          docker stop pogoda_api || true
          docker rm pogoda_api || true

  build-and-push:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.fork == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.WORKDIR }}
          push: true
          tags: |
            ${{ env.HUB_IMAGE_BASE }}:andrzej
            ${{ env.HUB_IMAGE_BASE }}:andrzej-${{ github.sha }}
            ${{ env.HUB_IMAGE_BASE }}:andrzej-${{ github.ref_name }}
            ${{ env.HUB_IMAGE_BASE }}:andrzej-${{ env.DEPLOY_ENV }}
